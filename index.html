<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Fruit Catcher Rocket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;}
    #game{width:100%;height:100%;}
  </style>
  <!-- CDN‑версия Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
</head>
<body>
  <div id="game"></div>
<script>
/* ===========================
   Fruit Catcher Rocket v1.0
   =========================== */

const GAME_WIDTH  = 480;
const GAME_HEIGHT = 800;
const GAME_DURATION = 60_000;   // длительность игры (мс)
const FRUIT_INTERVAL = 900;     // частота появления фруктов (мс)
const FALL_SPEED = 160;         // скорость падения фруктов (px/с)
const SCORE_PER_FRUIT = 100;

let score = 0;

const config = {
  type: Phaser.AUTO,
  parent: 'game',
  width: GAME_WIDTH,
  height: GAME_HEIGHT,
  backgroundColor: '#000000',
  physics: {
    default: 'arcade',
    arcade: {
      debug: false
    }
  },
  scene: {
    preload, create, update
  }
};

let rocket;
let fruits;
let scoreText;
let timerText;
let endScreenShown = false;

function preload () {
  // создаём текстуру ракеты простыми графическими примитивами
  const g = this.add.graphics();
  g.fillStyle(0xffffff, 1);
  g.fillRect(10, 0, 20, 40);          // тело
  g.fillTriangle(0, 40, 40, 40, 20, 60); // огонь
  g.generateTexture('rocket', 40, 60);
  g.destroy();
}

function create () {
  // положение ракеты снизу по центру
  rocket = this.physics.add.sprite(GAME_WIDTH / 2, GAME_HEIGHT - 70, 'rocket');
  rocket.setCollideWorldBounds(true);

  // группа фруктов
  fruits = this.physics.add.group();

  // тексты UI
  scoreText = this.add.text(10, 10, 'Счёт: 0', { font: '24px Arial', fill: '#ffffff' });
  timerText = this.add.text(GAME_WIDTH - 10, 10, '', { font: '24px Arial', fill: '#ffffff' }).setOrigin(1, 0);

  // таймер появления фруктов
  this.time.addEvent({ delay: FRUIT_INTERVAL, loop: true, callback: spawnFruit, callbackScope: this });

  // коллизия ракеты и фруктов
  this.physics.add.overlap(rocket, fruits, catchFruit, null, this);

  // конец игры через GAME_DURATION мс
  this.time.delayedCall(GAME_DURATION, endGame, [], this);
}

function spawnFruit () {
  const x = Phaser.Math.Between(20, GAME_WIDTH - 20);
  const color = Phaser.Display.Color.RandomRGB();
  const key = `fruit${Date.now()}`;
  const g = this.add.graphics();
  g.fillStyle(color.color, 1);
  g.fillCircle(20, 20, 20);
  g.generateTexture(key, 40, 40);
  g.destroy();
  const fruit = fruits.create(x, -20, key);
  fruit.setVelocityY(FALL_SPEED);
}

function catchFruit (rocket, fruit) {
  fruit.destroy();
  score += SCORE_PER_FRUIT;
  scoreText.setText('Счёт: ' + score);
}

function endGame () {
  if (endScreenShown) return;
  endScreenShown = true;
  // остановить физику и таймеры
  this.physics.pause();
  this.scene.pause();
  // показ финального окна
  const bg = this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT/2, 360, 240, 0x000000, 0.8);
  const txt = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 40, 'Игра окончена!', { font: '32px Arial', fill: '#ffffff' }).setOrigin(0.5);
  const final = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 20, `Ваш счёт: ${score}`, { font: '28px Arial', fill: '#ffff00' }).setOrigin(0.5);
  const reload = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 80, 'Нажмите для повтора', { font: '20px Arial', fill: '#00ff00' }).setOrigin(0.5).setInteractive();
  reload.once('pointerup', () => location.reload());
}

function update (time, delta) {
  // движение ракеты пальцем/мышью
  const pointer = this.input.activePointer;
  if (pointer.isDown) {
    rocket.x = Phaser.Math.Clamp(pointer.x, 20, GAME_WIDTH - 20);
  }
  // обновляем обратный счёт
  const remaining = Math.max(0, Math.ceil((GAME_DURATION - time) / 1000));
  timerText.setText('Время: ' + remaining);
}

new Phaser.Game(config);
</script>
</body>
</html>
