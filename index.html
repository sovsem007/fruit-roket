<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Fruit Catcher Rocket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html,body{margin:0;padding:0;overflow:hidden;height:100%;background:#000;}
    #game{width:100%;height:100%;}
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    /* цифровой ЖК‑шрифт */
    @import url('https://fonts.googleapis.com/css2?family=DSEG7+Classic:wght@400&display=swap');
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
</head>
<body>
  <div id="game"></div>
<script>
/* ====================================
   Fruit Catcher Rocket v1.4
   – правая граница фикса
   – крупный счёт + таймер LCD + ⏳
   – искристый взрыв
   – аккуратное финальное меню по центру
   ==================================== */

const W = 480;
const H = 800;
const GAME_DURATION = 60_000;
const FRUIT_INTERVAL = 900;
const FALL_SPEED = 160;
const SCORE_STEP = 100;

let score = 0, remaining = 60;

const config = {
  type: Phaser.AUTO,
  parent:'game',
  width: W,
  height:H,
  backgroundColor:'#000',
  physics:{ default:'arcade', arcade:{ debug:false }},
  scene:{ preload, create, update }
};

let rocket, fruits, scoreText, timerText, music, catchSound, sparksTextureKey='spark';
let pointerX;

function preload(){
  this.load.image('bg','assets/space_bg.png');
  this.load.image('rocket','assets/rocket.png');
  this.load.image('apple','assets/apple.png');
  this.load.image('banana','assets/banana.png');
  this.load.image('cherry','assets/cherry.png');
  this.load.audio('bgm','assets/bgm.mp3');
  this.load.audio('catch','assets/catch.mp3');
}

function create(){
  // фон
  this.add.image(W/2,H/2,'bg').setDisplaySize(W,H);

  // музыка/звук
  music = this.sound.add('bgm',{ volume:0.3, loop:true }).play();
  catchSound = this.sound.add('catch',{ volume:0.6 });

  // ракета
  rocket = this.physics.add.sprite(W/2,H-140,'rocket');
  rocket.setCollideWorldBounds(true);

  // фрукты
  fruits = this.physics.add.group();
  this.time.addEvent({ delay:FRUIT_INTERVAL, loop:true, callback:spawnFruit, callbackScope:this });

  // UI‑плашка
  const barH = 90;
  const uiBg = this.add.graphics();
  uiBg.fillStyle(0x000000,0.45).fillRoundedRect(10,10,W-20,barH,22).setDepth(2);

  scoreText = this.add.text(30,28,'Счёт: 0',{
    fontFamily:'Press Start 2P',fontSize:'36px',fill:'#00ff00',stroke:'#000',strokeThickness:8,
    shadow:{offsetX:2,offsetY:2,color:'#222',blur:2,fill:true}
  }).setDepth(3);

  timerText = this.add.text(W-40,28,'⏳ 60',{
    fontFamily:'DSEG7 Classic, monospace',fontSize:'40px',fill:'#ffff00',stroke:'#000',strokeThickness:6
  }).setOrigin(1,0).setDepth(3);

  // коллизия
  this.physics.add.overlap(rocket,fruits,catchFruit,null,this);

  // завершение
  this.time.delayedCall(GAME_DURATION,endGame,[],this);

  // spark texture (1×1 белый пиксель) для частиц
  if(!this.textures.exists(sparksTextureKey)){
    const g = this.textures.createCanvas(sparksTextureKey,2,2); g.context.fillStyle='#ffffff'; g.context.fillRect(0,0,2,2); g.refresh();
  }

  pointerX = rocket.x;
}

function spawnFruit(){
  const key = Phaser.Utils.Array.GetRandom(['apple','banana','cherry']);
  const half = this.textures.get(key).getSourceImage().width/2;
  const x = Phaser.Math.Between(half, W-half);
  fruits.create(x,-half,key).setVelocityY(FALL_SPEED);
}

function catchFruit(_,fruit){
  // искры
  const particles = this.add.particles(sparksTextureKey).setDepth(4);
  particles.createEmitter({
    x: fruit.x, y: fruit.y,
    speed: {min:80,max:180},
    angle: {min:0,max:360},
    lifespan: 400,
    quantity: 12,
    scale: {start:1,end:0},
    on: false
  }).explode();
  this.time.delayedCall(450,()=>particles.destroy());

  fruit.destroy();
  score += SCORE_STEP;
  scoreText.setText('Счёт: '+score);
  catchSound.play();
}

function endGame(){
  this.physics.pause();
  music.stop();
  const overlay = this.add.rectangle(W/2,H/2,W,H,0x000000,0.65).setDepth(5);

  const txtStyle = {fontFamily:'Press Start 2P',fontSize:'28px',fill:'#ffffff',stroke:'#000',strokeThickness:6,align:'center'};
  const scoreStyle = {fontFamily:'Press Start 2P',fontSize:'32px',fill:'#00ff00',stroke:'#000',strokeThickness:6,align:'center'};

  this.add.text(W/2,H/2-100,'Игра окончена!',txtStyle).setOrigin(0.5).setDepth(6);
  this.add.text(W/2,H/2-20,'Ваш счёт',txtStyle).setOrigin(0.5).setDepth(6);
  this.add.text(W/2,H/2+40,String(score),scoreStyle).setOrigin(0.5).setDepth(6);

  // кнопка
  const btnW=280, btnH=80, btnY=H/2+140;
  const btnGfx = this.add.graphics().setDepth(6);
  btnGfx.fillStyle(0xffcc00,1).fillRoundedRect(W/2-btnW/2,btnY,btnW,btnH,26);
  btnGfx.lineStyle(5,0xffffff,1).strokeRoundedRect(W/2-btnW/2,btnY,btnW,btnH,26);
  const btnTxt = this.add.text(W/2,btnY+btnH/2,'Играть ещё раз',{
    fontFamily:'Press Start 2P',fontSize:'22px',fill:'#000',stroke:'#fff',strokeThickness:3
  }).setOrigin(0.5).setDepth(7);
  const zone=this.add.zone(W/2,btnY+btnH/2,btnW,btnH).setOrigin(0.5).setDepth(8).setInteractive();
  zone.once('pointerup',()=>restartGame(this));
}

function restartGame(scene){
  score=0; remaining=60; scene.scene.restart();
}

function update(){
  // управление — учёт ширины спрайта, чтобы не вылезать
  const p=this.input.activePointer;
  const half=rocket.displayWidth/2;
  if(p.isDown){ pointerX = Phaser.Math.Clamp(p.x, half, W-half); }
  rocket.x = Phaser.Math.Linear(rocket.x,pointerX,0.25);

  // таймер
  const newRem=Math.max(0,Math.ceil((GAME_DURATION-this.time.now)/1000));
  if(newRem!==remaining){ remaining=newRem; timerText.setText('⏳ '+remaining.toString().padStart(2,' ')); }
}

new Phaser.Game(config);
</script>
</body>
</html>
