<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Fruit Catcher Rocket</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html,body{margin:0;padding:0;overflow:hidden;height:100%;background:#000;}
    #game{width:100%;height:100%;}
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=DSEG7+Classic:wght@400&display=swap');
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
</head>
<body>
  <div id="game"></div>
<script>
/* =====================================================
   Fruit Catcher Rocket v1.7
   – музыка стартует при первом тапе, играет всегда
   – убран mute/unmute, чтобы не ломать поток
   – фриз устранён (catchSound вызывается только после старта)
   – catch.wav → catch.mp3
   ===================================================== */

const W=480, H=800, GAME_DURATION=60_000, FRUIT_INTERVAL=900, FALL_SPEED=160, SCORE_STEP=100;
let score=0, remaining=60, audioReady=false;

const config={type:Phaser.AUTO,parent:'game',width:W,height:H,backgroundColor:'#000',physics:{default:'arcade',arcade:{debug:false}},scene:{preload,create,update}};

let rocket,fruits,scoreDigits,timerText,music,catchSound,pointerX;

function preload(){
  this.load.image('bg','assets/space_bg.png');
  this.load.image('rocket','assets/rocket.png');
  this.load.image('apple','assets/apple.png');
  this.load.image('banana','assets/banana.png');
  this.load.image('cherry','assets/cherry.png');
  this.load.audio('bgm','assets/bgm.mp3');
  this.load.audio('catch','assets/catch.mp3');
  const g=this.textures.createCanvas('spark',2,2);g.context.fillStyle='#fff';g.context.fillRect(0,0,2,2);g.refresh();
}

function create(){
  this.add.image(W/2,H/2,'bg').setDisplaySize(W,H);

  music=this.sound.add('bgm',{volume:0.3,loop:true});
  catchSound=this.sound.add('catch',{volume:0.6});

  // Старт аудио и отметка готовности
  this.input.once('pointerdown',()=>{ music.play(); audioReady=true; });

  rocket=this.physics.add.sprite(W/2,H-140,'rocket');
  rocket.setCollideWorldBounds(true);

  fruits=this.physics.add.group();
  this.time.addEvent({delay:FRUIT_INTERVAL,loop:true,callback:spawnFruit,callbackScope:this});
  this.physics.add.overlap(rocket,fruits,catchFruit,null,this);

  // UI
  this.add.text(20,20,'Счёт',{fontFamily:'Press Start 2P',fontSize:'30px',fill:'#ffffff',stroke:'#000',strokeThickness:6}).setDepth(3);
  scoreDigits=this.add.text(20,66,'0000',{fontFamily:'DSEG7 Classic',fontSize:'52px',fill:'#00ff00'}).setDepth(3);
  timerText=this.add.text(20,140,'⏳ 60',{fontFamily:'DSEG7 Classic',fontSize:'48px',fill:'#ffff00'}).setDepth(3);

  this.time.delayedCall(GAME_DURATION,endGame,[],this);
  pointerX=rocket.x;
}

function spawnFruit(){
  const key=Phaser.Utils.Array.GetRandom(['apple','banana','cherry']);
  const half=this.textures.get(key).getSourceImage().width/2;
  const x=Phaser.Math.Between(half,W-half);
  fruits.create(x,-half,key).setVelocityY(FALL_SPEED);
}

function explode(scene,x,y){
  const p=scene.add.particles('spark').setDepth(4);
  p.createEmitter({x,y,speed:{min:110,max:230},angle:{min:0,max:360},scale:{start:1,end:0},lifespan:450,quantity:16,on:false}).explode();
  scene.time.delayedCall(500,()=>p.destroy());
}

function catchFruit(_,fruit){
  explode(this,fruit.x,fruit.y);
  fruit.destroy();
  score+=SCORE_STEP;
  scoreDigits.setText(score.toString().padStart(4,'0'));
  if(audioReady) catchSound.play();
}

function endGame(){
  this.physics.pause();
  const overlay=this.add.rectangle(W/2,H/2,W,H,0x000,0.6).setDepth(5);
  const style={fontFamily:'Press Start 2P',fontSize:'28px',fill:'#fff',stroke:'#000',strokeThickness:6,align:'center'};
  const scoreStyle={fontFamily:'DSEG7 Classic',fontSize:'44px',fill:'#00ff00',align:'center'};
  this.add.text(W/2,H/2-50,'Ваш счёт',style).setOrigin(0.5).setDepth(6);
  this.add.text(W/2,H/2+10,score.toString(),scoreStyle).setOrigin(0.5).setDepth(6);
  const btnW=240,btnH=70,btnY=H/2+110;
  const gfx=this.add.graphics().setDepth(6);
  gfx.fillStyle(0xffcc00,1).fillRoundedRect(W/2-btnW/2,btnY,btnW,btnH,22);
  gfx.lineStyle(4,0xffffff,1).strokeRoundedRect(W/2-btnW/2,btnY,btnW,btnH,22);
  this.add.text(W/2,btnY+btnH/2,'Играть ещё раз',{fontFamily:'Press Start 2P',fontSize:'22px',fill:'#000',stroke:'#fff',strokeThickness:3}).setOrigin(0.5).setDepth(7);
  this.add.zone(W/2,btnY+btnH/2,btnW,btnH).setOrigin(0.5).setDepth(8).setInteractive().once('pointerup',()=>restartGame(this));
}

function restartGame(scene){score=0;remaining=60;scene.scene.restart();}

function update(){
  const p=this.input.activePointer, half=rocket.displayWidth/2;
  if(p.isDown) pointerX=Phaser.Math.Clamp(p.x,half,W-half);
  rocket.x=Phaser.Math.Linear(rocket.x,pointerX,0.25);
  const newRem=Math.max(0,Math.ceil((GAME_DURATION-this.time.now)/1000));
  if(newRem!==remaining){remaining=newRem;timerText.setText('⏳ '+remaining.toString().padStart(2,' '));}
}

new Phaser.Game(config);
</script>
</body>
</html>
